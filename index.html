<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <nav>
            <div class="logo">
                <img src="assists/NetflixLogo.svg" alt="Netflix" height="40px">
            </div>
            <div class="button">
                <button class="language"> <img src="assists/lang logo.svg" height="18px">English<img
                        src="assists/Down Arrow.svg" alt="" height="18"></button>
                <button class="Signin">Sign In </button>
            </div>
        </nav>
        <div class="hero">
            <h1>Unlimited movies, shows, and more</h1>
            <p class="price">
                Starts at ₹149. Cancel at any time.
            </p>

            <p class="description">
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <div class="email-box">
                <input type="email" placeholder="Email address">
               <button>Get Started ❯</button>
            </div>
        </div>
    </div>
</body>

</html>
